version: '3.9'

services:
  influxdb:
    image: influxdb:2
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=12341234
      - DOCKER_INFLUXDB_INIT_ORG=localInfluxTest
      - DOCKER_INFLUXDB_INIT_BUCKET=SoundDetectorTest
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-token
    volumes:
      - influx_data:/var/lib/influxdb2

  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: upa_test
    volumes:
      - mongo_data:/data/db

volumes:
  influx_data:
  mongo_data:
